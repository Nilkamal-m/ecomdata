name: Daily Data Engineer Job Alert Pipeline

on:
  schedule:
    # Trigger Monday through Friday at 10:00 AM IST (04:30 AM UTC) & 08:30 PM IST (03:00 PM UTC) - Excludes Saturday & Sunday
    - cron: '30 4,15 * * 1-5'
  workflow_dispatch: # Enables manual run from GitHub Actions UI

permissions:
  contents: write # Grants write access to commit temp.csv back to repository

jobs:
  run-job-finder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Job Finder Alert System
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_API_TOKEN_1: ${{ secrets.APIFY_API_TOKEN_1 }}
          APIFY_API_TOKEN_2: ${{ secrets.APIFY_API_TOKEN_2 }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python job_finder.py

      - name: Commit and Push Updated temp.csv (Next-Day Deduplication)
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          if [ -f temp.csv ]; then
            git add temp.csv
            git diff --staged --quiet || (git commit -m "Auto-update temp.csv with seen job records [skip ci]" && git push)
          fi
